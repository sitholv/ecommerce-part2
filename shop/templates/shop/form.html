{% extends "shop/base.html" %}
{% block content %}
    <h1>{{ title }}</h1>
    <form method="post" class="panel editor" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {% if field.help_text %}
                    <div class="help">{{ field.help_text|striptags }}</div>
                {% endif %}
                {{ field }}{{ field.errors }}
            </div>
        {% endfor %}
        <button class="primary" type="submit">Save</button>
        <a href="{% url 'catalogue' %}">Cancel</a>
    </form>
{% endblock %}
