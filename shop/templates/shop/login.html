{% extends "shop/form.html" %}
{% block title %}
    Log in · Bay Market
{% endblock %}
{% block content %}
    <h1>Log in</h1>
    <form class="panel editor" method="post">
        {% csrf_token %}
        {{ form.as_p }}<input type="hidden" name="next" value="{{ next }}">
        <button class="primary" type="submit">Log in</button>
    </form>
    <p>
        <a href="{% url 'reset_request' %}">Forgot your password?</a>
    </p>
{% endblock %}
